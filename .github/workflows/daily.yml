# An hourly check decides what to do (site/updater/watch.js). The full update (read the official feeds, create and
# refresh pages, test, build, save) runs every 3 hours, and every hour while a release is within 2 days before to 3 days
# after its date. The slow outside-link check runs once a day (06:00 UTC) and on manual runs.
# Saving (git push) makes Cloudflare Pages rebuild and publish the site.
# When pages are created or the review list changes, the owner gets a GitHub issue (GitHub emails it).
name: Daily update
on:
  schedule:
    - cron: '15 * * * *' # hourly check; the full update runs every 3 hours or near a launch
  workflow_dispatch: # "Run workflow" button for a manual run
permissions:
  contents: write
  issues: write
concurrency: daily-update
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Launch watch (skip the rest when nothing is close)
        id: gate
        run: node updater/watch.js
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - name: Read feeds and apply safe changes
        if: steps.gate.outputs.run == 'true'
        run: npm run update -- --write
      - name: Tests (nothing is saved if they fail)
        if: steps.gate.outputs.run == 'true'
        run: npm test
      - run: npm run build
        if: steps.gate.outputs.run == 'true'
      - name: Check outside links (once a day)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.links == 'true'
        id: links
        continue-on-error: true
        run: npm run check-links > updater/links.txt 2>&1
      - name: Save changed data
        if: steps.gate.outputs.run == 'true'
        id: save
        run: |
          git config user.name "release-updater"
          git config user.email "release-updater@users.noreply.github.com"
          git add src/data updater/log.json updater/last-run.md updater/index-queue.json
          if git diff --cached --name-only | grep -q 'updater/last-run.md'; then echo "summary=changed" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet; then echo "No data changes."; else git commit -m "Daily update $(date -u +%F)" && git push && echo "pushed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Tell Bing and others about changed pages (IndexNow)
        if: steps.save.outputs.pushed == 'yes'
        continue-on-error: true
        run: sleep 120 && npm run indexnow
      - name: Alert the owner when something needs attention
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.save.outputs.summary }}" = "changed" ] || [ "${{ steps.links.outcome }}" = "failure" ]; then
            { cat updater/last-run.md; echo; echo '### Link check'; cat updater/links.txt 2>/dev/null || echo 'Not checked this run.'; } > /tmp/alert.md
            gh issue create --title "Updater: review needed ($(date -u +%F))" --body-file /tmp/alert.md
          fi
